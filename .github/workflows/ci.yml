name: First CI Workflow #github action上的標題

on: { push: { branches: [ "main" ] } } #定義觸發條件，當任何branch有git push時都會觸發，因此通常會指定分支，避免誤觸

jobs: #YAML的Map結構，定義接下來要平行或依序執行的任務群組
    build-and-test:
        runs-on: ubuntu-latest #指定執行環境

        steps:
          - name: Checkout code
            uses: actions/checkout@v3 #將github repository的代碼下載到VM當前的目錄

          - name: Install dependencies
            run: composer install  --prefer-dist --no-progress #安裝php相依套件

          - name: Run a script
            run: echo "Hello, CI World"

          - name: Check PHP version
            run: php -v

          - name: Run PHPUnit
            run: vendor/bin/phpunit --bootstrap vendor/autoload.php tests # 進行測試
          
          - name: Set up Docker Buildx
            uses: docker/setup-buildx-action@v3
          
          - name: Login to Docker Hub
            uses: docker/login-action@v3
            with:
              username: ${{ secrets.DOCKER_USERNAME }}
              password: ${{ secrets.DOCKER_PASSWORD }}
          
          - name: Build and push
            uses: docker/build-push-action@v5
            with:
              context: . #指定dockerfile所在位置
              push: true #打包完自動上傳到docker hub
              tags: | #打標籤
                ${{ secrets.DOCKER_USERNAME }}/my-php-app:latest
                ${{ secrets.DOCKER_USERNAME }}/my-php-app:${{ github.sha }}
              cache-from: type=gha
              cache-to: type=gha,mode=max
    deploy:
        runs-on: ubuntu-latest
        needs: build-and-test #依賴宣告，只有當指定的任務完成後才會執行
        steps:
          - name: Deploy to server via SSH
            uses: appleboy/ssh-action@v1.0.3 # 建立ssh連線並執行遠端命令
            with: 
              host: ${{ secrets.REMOTE_HOST }}
              username: ubuntu
              key: ${{ secrets.SSH_PRIVATE_KEY }}
              script: | #即將在遠端EC2上執行的shell script區塊
                docker network create monitor-net || true
                docker pull ${{ secrets.DOCKER_USERNAME }}/my-php-app:latest
                docker stop my-php-app || true 
                docker rm my-php-app || true
                docker run -d --name my-php-app --network monitor-net -p 8080:80 ${{ secrets.DOCKER_USERNAME }}/my-php-app:latest
                docker image prune -f


